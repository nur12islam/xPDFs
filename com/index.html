<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML PDF Compiler • XARK</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<header>
  <a href="../">← XARK</a>
  <b>HTML PDF Compiler</b>
  <span>Browser-only</span>
</header>

<div class="app">

  <section class="editor">
    <h1>HTML → PDF</h1>
    <p class="intro">Paste HTML, preview it on A4, and export it as a PDF.</p>

    <div class="upload-zone-wrap">
      <div class="input-div" id="htmlDropZone" tabindex="0" role="button" aria-label="Upload HTML file">
        <input class="input" id="htmlFile" type="file" accept=".html,.htm,text/html" aria-label="Upload HTML file">
        <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" stroke-linejoin="round" stroke-linecap="round" viewBox="0 0 24 24" stroke-width="2" fill="none" stroke="currentColor" class="upload-icon">
          <polyline points="16 16 12 12 8 16"></polyline>
          <line y2="21" x2="12" y1="12" x1="12"></line>
          <path d="M20.39 18.39A5 5 0 1 0 3 16.3"></path>
          <polyline points="16 16 12 12 8 16"></polyline>
        </svg>
      </div>
      <div class="upload-copy">
        <b>Upload HTML</b>
        <span>Click or drag & drop an .html / .htm file</span>
        <small>Non-HTML files are ignored.</small>
      </div>
    </div>

    <label>
      HTML
      <textarea id="htmlInput" spellcheck="false"
        placeholder="Paste your complete HTML here..."></textarea>
    </label>

    <div class="controls">
      <label>
        Page size
        <select id="pageSize">
          <option value="A4" selected>A4</option>
          <option value="Letter">Letter</option>
          <option value="A5">A5</option>
        </select>
      </label>

      <label>
        Orientation
        <select id="orientation">
          <option value="portrait" selected>Portrait</option>
          <option value="landscape">Landscape</option>
        </select>
      </label>

      <label>
        Margin
        <select id="margin">
          <option value="8">8 mm</option>
          <option value="12" selected>12 mm</option>
          <option value="15">15 mm</option>
          <option value="20">20 mm</option>
          <option value="25">25 mm</option>
        </select>
      </label>
    </div>

    <div class="actions">
      <button id="previewBtn">Update Preview</button>
      <button id="pdfBtn">Download PDF</button>
      <button id="printBtn" class="secondary">Print / Save PDF</button>
      <button id="clearBtn" class="secondary">Clear</button>
    </div>

    <p id="status" class="status"></p>
    <p class="privacy">
      HTML is processed in your browser. No backend is required.
    </p>
  </section>

  <section class="preview-area">
    <div class="preview-label">LIVE A4 PREVIEW</div>
    <div id="preview"></div>
  </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.3/dist/html2pdf.bundle.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
